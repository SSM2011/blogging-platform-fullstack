# Standalone Grafana Helm values (if not using kube-prometheus-stack bundled Grafana)
# Install: helm install grafana grafana/grafana -f values.yaml -n monitoring

replicas: 1

persistence:
  enabled: true
  size: 10Gi
  storageClassName: gp3

adminUser: admin
adminPassword: "CHANGE_ME_IN_PRODUCTION"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'blogging-platform'
        orgId: 1
        folder: 'Blogging Platform'
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/blogging-platform

dashboardsConfigMaps:
  blogging-platform: "grafana-dashboards"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - grafana.writersroom.developersubodh.in
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.writersroom.developersubodh.in
