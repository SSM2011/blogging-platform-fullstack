apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blogging-backend-monitor
  namespace: blogging-platform
  labels:
    app: blogging-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: blogging-backend
  namespaceSelector:
    matchNames:
      - blogging-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blogging-frontend-monitor
  namespace: blogging-platform
  labels:
    app: blogging-frontend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: blogging-frontend
  namespaceSelector:
    matchNames:
      - blogging-platform
  endpoints:
    - port: http
      path: /nginx-health
      interval: 60s
      scrapeTimeout: 10s
