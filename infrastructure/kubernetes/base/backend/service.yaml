apiVersion: v1
kind: Service
metadata:
  name: blogging-backend-svc
  namespace: blogging-platform
  labels:
    app: blogging-backend
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: blogging-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
